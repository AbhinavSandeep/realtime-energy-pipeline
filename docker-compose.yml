# Real-time data backend for streaming smart-meter energy data
# IU Project: Data Engineering (DLMDSEDE02), Task 2
#
# Start everything:   docker compose up -d --build
# Scale processing:   docker compose up -d --scale spark-worker=2
# Simulate meters:    docker compose up -d --scale producer=3
# Stop (keep data):   docker compose down
# Reset everything:   docker compose down -v

name: energy-pipeline

x-restart: &restart
  restart: unless-stopped

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:

  # ---------------------------------------------------------------- buffer
  kafka:
    image: apache/kafka:3.9.0
    <<: [*restart, *logging]
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_RETENTION_HOURS: ${KAFKA_RETENTION_HOURS:-168}
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks: [pipeline-net]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 20s
      retries: 12
      start_period: 20s
    mem_limit: 1g

  # One-shot job that creates the topics (idempotent: --if-not-exists)
  kafka-init:
    image: apache/kafka:3.9.0
    <<: *logging
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      RAW_TOPIC: ${RAW_TOPIC}
      AGG_TOPIC: ${AGG_TOPIC}
      DLQ_TOPIC: ${DLQ_TOPIC}
      RAW_PARTITIONS: ${RAW_PARTITIONS:-3}
      RETENTION_MS: ${TOPIC_RETENTION_MS:-604800000}
    volumes:
      - ./kafka/create-topics.sh:/create-topics.sh:ro
    entrypoint: ["/bin/bash", "/create-topics.sh"]
    networks: [pipeline-net]
    restart: "no"

  # ---------------------------------------------------------------- ingestion
  producer:
    build: ./producer
    image: energy-pipeline/producer:1.0
    <<: [*restart, *logging]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      RAW_TOPIC: ${RAW_TOPIC}
      DLQ_TOPIC: ${DLQ_TOPIC}
      DATA_URL: ${DATA_URL}
      DATA_FILE: /data/household_power_consumption.txt
      STATE_DIR: /state
      SPEEDUP: ${SPEEDUP:-3600}
      MAX_EVENTS: ${MAX_EVENTS:-0}
      LATE_EVENT_RATE: ${LATE_EVENT_RATE:-0.002}
      LATE_DELAY_MINUTES: ${LATE_DELAY_MINUTES:-5}
      FOLLOW: ${FOLLOW:-true}
      JOIN_STREAM_TIME: ${JOIN_STREAM_TIME:-true}
      METER_ID_SALT: ${METER_ID_SALT}
    volumes:
      - ./data:/data
      - producer-state:/state
    networks: [pipeline-net]
    mem_limit: 256m

  # ---------------------------------------------------------------- processing
  spark-master:
    build: ./spark
    image: energy-pipeline/spark:1.0
    <<: [*restart, *logging]
    hostname: spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master",
              "--host", "spark-master", "--port", "7077", "--webui-port", "8080"]
    ports:
      - "127.0.0.1:8081:8080"   # Spark master UI
    networks: [pipeline-net]
    healthcheck:
      # the master binds to its service name (--host spark-master), not to localhost
      test: ["CMD-SHELL", "bash -c '</dev/tcp/spark-master/7077'"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 768m

  spark-worker:
    image: energy-pipeline/spark:1.0
    <<: [*restart, *logging]
    depends_on:
      spark-master:
        condition: service_healthy
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker",
              "spark://spark-master:7077"]
    environment:
      SPARK_WORKER_CORES: ${SPARK_WORKER_CORES:-2}
      SPARK_WORKER_MEMORY: ${SPARK_WORKER_MEMORY:-1g}
    volumes:
      - spark-checkpoints:/checkpoints
    networks: [pipeline-net]
    mem_limit: 1536m

  # Driver of the streaming application (client mode)
  spark-job:
    image: energy-pipeline/spark:1.0
    <<: [*restart, *logging]
    hostname: spark-job
    depends_on:
      spark-master:
        condition: service_healthy
      spark-worker:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
      timescaledb:
        condition: service_healthy
    command: ["/opt/spark/bin/spark-submit",
              "--master", "spark://spark-master:7077",
              "--conf", "spark.driver.host=spark-job",
              "--conf", "spark.sql.shuffle.partitions=6",
              "--conf", "spark.executor.memory=768m",
              "--conf", "spark.driver.memory=768m",
              "/opt/app/stream_job.py"]
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      RAW_TOPIC: ${RAW_TOPIC}
      AGG_TOPIC: ${AGG_TOPIC}
      DLQ_TOPIC: ${DLQ_TOPIC}
      CHECKPOINT_DIR: /checkpoints
      TRIGGER_SECONDS: ${TRIGGER_SECONDS:-5}
      WATERMARK: ${WATERMARK:-10 minutes}
      MAX_OFFSETS_PER_TRIGGER: ${MAX_OFFSETS_PER_TRIGGER:-20000}
      VOLTAGE_MIN: ${VOLTAGE_MIN:-200}
      VOLTAGE_MAX: ${VOLTAGE_MAX:-260}
      DB_HOST: timescaledb
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${WRITER_USER}
      DB_PASSWORD: ${WRITER_PASSWORD}
    volumes:
      - spark-checkpoints:/checkpoints
    ports:
      - "127.0.0.1:4040:4040"   # Spark application UI
    networks: [pipeline-net]
    mem_limit: 2g

  # ---------------------------------------------------------------- storage
  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    <<: [*restart, *logging]
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      WRITER_USER: ${WRITER_USER}
      WRITER_PASSWORD: ${WRITER_PASSWORD}
      READER_USER: ${READER_USER}
      READER_PASSWORD: ${READER_PASSWORD}
      TS_TUNE_MEMORY: 1GB
    volumes:
      - db-data:/var/lib/postgresql/data
      # Added next to the image's own init scripts (which install TimescaleDB)
      - ./db/init/01-init.sh:/docker-entrypoint-initdb.d/100-energy-init.sh:ro
    networks: [pipeline-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 1g

  # ---------------------------------------------------------------- delivery
  api:
    build: ./api
    image: energy-pipeline/api:1.0
    <<: [*restart, *logging]
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      DB_HOST: timescaledb
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${READER_USER}
      DB_PASSWORD: ${READER_PASSWORD}
      API_KEY: ${API_KEY:-}
    ports:
      - "127.0.0.1:8000:8000"
    networks: [pipeline-net]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: 256m

  # ---------------------------------------------------------------- monitoring
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    <<: [*restart, *logging]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: energy-pipeline
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "127.0.0.1:8080:8080"
    networks: [pipeline-net]
    mem_limit: 512m

  grafana:
    image: grafana/grafana:11.3.0
    <<: [*restart, *logging]
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      DB_NAME: ${POSTGRES_DB}
      READER_USER: ${READER_USER}
      READER_PASSWORD: ${READER_PASSWORD}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    networks: [pipeline-net]
    mem_limit: 384m

networks:
  pipeline-net:
    driver: bridge

volumes:
  kafka-data:
  db-data:
  spark-checkpoints:
  producer-state:
  grafana-data:

apiVersion: 1

datasources:
  - name: TimescaleDB
    uid: timescaledb
    type: grafana-postgresql-datasource
    access: proxy
    url: timescaledb:5432
    user: ${READER_USER}
    isDefault: true
    jsonData:
      database: ${DB_NAME}
      sslmode: disable
      postgresVersion: 1600
      timescaledb: true
      maxOpenConns: 5
    secureJsonData:
      password: ${READER_PASSWORD}
    editable: false
